dos:
  name:       Dos (x86)
  manufacturer: Microsoft
  release: 1981
  hardware: computer
  theme:      pc
  platform:   pc
  comment_en: |
    Each game (files) must be placed in its own directory having the ".pc .dos" extension.
    In each directory, a dosbox.bat file must contain the command line for launching the game.

    For example:
    miniputt.pc/
    miniputt.pc/dosbox.bat
    miniputt.pc/MP.DAT
    miniputt.pc/MP.EXE

    Where dosbox.bat contains: MP.EXE

    With pure-dosbox you can also use zip files.

    To quit a game, press CTRL + F9.

    MIDI:

    SoundFonts (.sf2) files need to be placed in the /userdata/bios folder.
    MT32_CONTROL.ROM file needs to be present inside /userdata/bios/scummvm/extra.

    For more info: https://wiki.batocera.org/systems:dos
  comment_fr: |
    Chaque jeu (fichiers) doit être contenu dans un dossier ayant l'extension ".pc .dos".
    Dans chaque dossier, un fichier dosbox.bat doit comporter la ligne de commande pour lancer le jeu.

    Par exemple:
    miniputt.pc/
    miniputt.pc/dosbox.bat
    miniputt.pc/MP.DAT
    miniputt.pc/MP.EXE

    Et dosbox.bat contient: MP.EXE

    Avec pure-dosbox vous pouvez aussi utiliser des fichiers zip.

    Pour quitter un jeu, appuyer sur CTRL + F9.

    MIDI:

    Les fichiers SoundFonts (.sf2) doivent être placés dans le dossier /userdata/bios.
    Le fichier MT32_CONTROL.ROM doit être présent dans /userdata/bios/scummvm/extra.

    La doc dos pour Batocera se trouve à cet endroit : https://wiki.batocera.org/systems:dos
  comment_br: |
     Cada jogo (arquivos) deve ser colocado em seu próprio diretório com a extensão ".pc .dos".
     Em cada diretório, um arquivo dosbox.bat deve conter a linha de comando para iniciar o jogo.

     Por exemplo:
     miniputt.pc/
     miniputt.pc/dosbox.bat
     miniputt.pc/MP.DAT
     miniputt.pc/MP.EXE

     Onde o dosbox.bat contém: MP.EXE

     Com pure-dosbox você também pode usar arquivos zip.

     Para sair de um jogo, pressione CTRL + F9.

     MIDI:

     Os arquivos SoundFonts (.sf2) precisam ser colocados na pasta /userdata/bios.
     O arquivo MT32_CONTROL.ROM precisa estar presente em /userdata/bios/scummvm/extra.

     Para mais informações: https://wiki.batocera.org/systems:dos

fbneo:
  name:       Final Burn Neo
  manufacturer: Arcade
  release: 2019
  hardware: arcade
  platform:   arcade
  comment_en: |
    ROMs must come from the FBNeo romset version 1.0.0.0

    The file FinalBurn Neo (ClrMame Pro XML, Arcade only).dat in bios/FBNeo may be used to check ROMs with clrmamepro available at http://mamedev.emulab.it/clrmamepro/

    For more info: https://wiki.batocera.org/arcade
  comment_fr: |
    Les ROMs doivent provenir du romset 1.0.0.0

    Le fichier FinalBurn Neo (ClrMame Pro XML, Arcade only).dat dans bios/FBNeo peut servir à valider les ROMs avec clrmamepro disponible sur http://mamedev.emulab.it/clrmamepro/

    Vous pouvez trouver la doc arcade là : https://wiki.batocera.org/arcade
  comment_br: |
    As ROMs devem vir do romset FBneo versão 1.0.0.0

    O arquivo FinalBurn Neo (ClrMame Pro XML, somente Arcade).dat em bios/FBNeo pode ser usado para verificar ROMs com clrmamepro disponível em http://mamedev.emulab.it/clrmamepro/

    Para mais informações: https://wiki.batocera.org/arcade

mame:
  name:       Mame
  manufacturer: Arcade
  release: 1997
  hardware: arcade
  platform:   arcade

  comment_en: |
    The system uses libretro mame2003+ as default core: compatible ROMs must come from set 0.78+
    Depending on your hardware, other mame cores are included:
      - latest mame core (0.228 currently)
      - imame4all based on 0.37b5 romset
      - mame2010 based on 0.139 romset

    Special files for mame2003 core:
    - Add your samples files in /userdata/bios/mame2003/samples/

    For more info: https://wiki.batocera.org/arcade
  comment_fr: |
    Le système utilise le core libretro mame2003+ par défaut: Les ROMs compatibles doivent provenir du set 0.78+
    D'autres cores mame sont également inclus:
          - le dernier core mame  (0.228 à l'heure actuelle)
          - imame4all utilisant le romset 0.37b5
          - mame2010 utilisant le romset 0.139

    Fichiers spéciaux pour le core mame2003+ :
    - Ajoutez vos fichiers samples dans le répertoire /userdata/bios/mame2003/samples/

    Vous pouvez trouver la doc arcade là : https://wiki.batocera.org/arcade
  comment_br: |
    O sistema usa o libretro mame2003+ como núcleo padrão: ROMs compatíveis devem vir da versão de romset 0.78+
    Dependendo do seu hardawre, outros núcleos mame estão incluídos:
      - núcleo mame mais recente (0,228 atualmente)
      - imame4all baseado no romset 0.37b5
      - mame2010 baseado em romset 0.139

    Arquivos especiais para o núcleo mame2003:
    - Adicione seus arquivos de samples em /userdata/bios/mame2003/samples/

    Para mais informações: https://wiki.batocera.org/arcade

