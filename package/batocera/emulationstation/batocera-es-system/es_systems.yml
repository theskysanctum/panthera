ps3:
  name:       PlayStation 3
  manufacturer: Sony
  release: 2006
  hardware: console
  comment_en: |
    You must first load the firmware by running rpcs3-config from menu>f1>Applications then File>Install firmware.
    PS3 roms are directories must be renamed to end with .ps3.
    PSN digital games are installed in rpcs3-config, create a text file ending with .psn that contains the game's ID.
    First time you load a game, it takes time (a progress bar is visible). It doesn't happen next times.

    For more info: https://wiki.batocera.org/systems:ps3
  comment_fr: |
    Vous devez préalablement charger le firmware en lançant rpcs3-config depuis menu>f1>Applications puis File>Install firmware.
    Les roms ps3 sont des dossiers ; ils doivent être renommés pour terminer par .ps3
    La première fois que vous chargez un jeu, cela met du temps (une barre de progression est visible). Cela ne se produit pas les fois suivantes.

    Trouvez la documentation ici : https://wiki.batocera.org/systems:ps3
  comment_br: |
    Você deve primeiramente carregar o firmware executando o rpcs3-config no menu>f1>Applications e depois File>Install firmware.
    As roms de PS3 são diretórios que devem ser renomeados para terminar com .ps3.
    Os jogos digitais da PSN são instalados no rpcs3-config, crie um arquivo de texto que termine com .psn que contenha o ID do jogo.
    A primeira vez que você carrega um jogo, levará tempo para ser processado (uma barra de progresso é visível). Isso não acontece nas próximas vezes.

    Para mais informações: https://wiki.batocera.org/systems:ps3

