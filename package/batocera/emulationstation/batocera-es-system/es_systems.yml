os_install:
  name:       Install Other OS
  manufacturer: Various
  release:
  hardware: computer
  file_extensions: [iso]
  platform: pc
  group:      other_environments
  comment_en: |
    ## OTHER ENVIRONMENTS : INSTALL ##
    -------------------------------------------------------------------------------
    Drop an installer ISO here to install another operating system via QEMU.
    A virtual hard disk is created automatically and shows up in "Virtual
    Hard Disks" (os_hdds) once the install is done, ready to boot directly.
  comment_fr: |
    ## AUTRES ENVIRONNEMENTS : INSTALLATION ##
    -------------------------------------------------------------------------------
    Placez ici un ISO d'installation pour installer un autre système
    d'exploitation via QEMU. Un disque dur virtuel est créé automatiquement
    et apparaît dans "Disques Durs Virtuels" (os_hdds) une fois l'installation
    terminée, prêt à démarrer directement.
  comment_br: |
    ## OUTROS AMBIENTES : INSTALAÇÃO ##
    -------------------------------------------------------------------------------
    Coloque aqui um ISO de instalação para instalar outro sistema operacional
    via QEMU. Um disco rígido virtual é criado automaticamente e aparece em
    "Discos Rígidos Virtuais" (os_hdds) após a instalação, pronto para iniciar.

os_hdds:
  name:       Virtual Hard Disks
  manufacturer: Various
  release:
  hardware: computer
  file_extensions: [qcow2, img, raw]
  platform: pc
  group:      other_environments
  comment_en: |
    ## OTHER ENVIRONMENTS : VIRTUAL HARD DISKS ##
    -------------------------------------------------------------------------------
    Virtual hard disks (qcow2/img/raw), booted directly via QEMU. This is
    where installs from "Install Other OS" (os_install) end up; you can
    also drop pre-made disk images here directly.
  comment_fr: |
    ## AUTRES ENVIRONNEMENTS : DISQUES DURS VIRTUELS ##
    -------------------------------------------------------------------------------
    Disques durs virtuels (qcow2/img/raw), démarrés directement via QEMU.
    C'est ici que se retrouvent les installations depuis "Installation"
    (os_install) ; vous pouvez aussi y déposer directement des images disque.
  comment_br: |
    ## OUTROS AMBIENTES : DISCOS RÍGIDOS VIRTUAIS ##
    -------------------------------------------------------------------------------
    Discos rígidos virtuais (qcow2/img/raw), iniciados diretamente via QEMU.
    É aqui que as instalações feitas em "Instalação" (os_install) terminam;
    você também pode colocar imagens de disco prontas aqui diretamente.

vm_apps:
  name:       VM Applications
  manufacturer: Various
  release:
  hardware: computer
  file_extensions: [vmapp]
  platform: pc
  group:      other_environments
  comment_en: |
    ## OTHER ENVIRONMENTS : APPLICATIONS ##
    -------------------------------------------------------------------------------
    Shortcuts that boot a disk from "Virtual Hard Disks" (os_hdds) and launch a
    single program inside it, via the QEMU guest agent (needs the VirtIO-Win
    Guest Tools installed in that guest - see "Install Other OS"). The VM shuts
    down automatically once the program exits. Create a shortcut with a text
    editor as a ".vmapp" file:
      disk: name.qcow2          # path, relative to the os_hdds folder
      core: win10                # winxp / win7 / win10 / other - must match the disk
      exe: C:\Path\To\App.exe
      args: []                   # optional command-line arguments
  comment_fr: |
    ## AUTRES ENVIRONNEMENTS : APPLICATIONS ##
    -------------------------------------------------------------------------------
    Raccourcis qui démarrent un disque depuis "Disques Durs Virtuels" (os_hdds)
    et y lancent un seul programme, via l'agent invité QEMU (nécessite les
    VirtIO-Win Guest Tools installés dans cet invité - voir "Installation"). La
    VM s'arrête automatiquement une fois le programme terminé. Créez un
    raccourci avec un éditeur de texte sous forme de fichier ".vmapp" :
      disk: nom.qcow2            # chemin, relatif au dossier os_hdds
      core: win10                 # winxp / win7 / win10 / other - doit correspondre au disque
      exe: C:\Chemin\Vers\App.exe
      args: []                    # arguments de ligne de commande optionnels
  comment_br: |
    ## OUTROS AMBIENTES : APLICATIVOS ##
    -------------------------------------------------------------------------------
    Atalhos que iniciam um disco de "Discos Rígidos Virtuais" (os_hdds) e
    executam um único programa nele, via o agente guest do QEMU (requer o
    VirtIO-Win Guest Tools instalado nesse guest - veja "Instalação"). A VM se
    desliga automaticamente quando o programa termina. Crie um atalho com um
    editor de texto como um arquivo ".vmapp":
      disk: nome.qcow2           # caminho, relativo à pasta os_hdds
      core: win10                 # winxp / win7 / win10 / other - deve corresponder ao disco
      exe: C:\Caminho\Para\App.exe
      args: []                    # argumentos de linha de comando opcionais

